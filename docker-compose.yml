version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: badminton-mysql
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: badminton_analysis
      MYSQL_USER: admin
      MYSQL_PASSWORD: password
    volumes:
      - mysql_data:/var/lib/mysql
      - ./api/database/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  backend:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: badminton-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/badminton_analysis?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: password
      UPLOAD_PATH: /app/uploads/videos
    volumes:
      - uploads:/app/uploads
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: badminton-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mysql_data:
  uploads: